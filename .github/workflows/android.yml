name: Build Norma APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Norma_Android_Project.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Rozbalit projekt
        run: unzip -q Norma_Android_Project.zip

      - name: Pripravit Normu
        working-directory: norma_android_project
        run: |
          base64 -d app/src/main/assets/www/index.html.gz.b64 | gunzip > app/src/main/assets/www/index.html

      - name: Zostavit APK
        working-directory: norma_android_project
        run: gradle --no-daemon assembleDebug

      - name: Pripravit APK
        run: cp norma_android_project/app/build/outputs/apk/debug/app-debug.apk Norma-beta.apk

      - name: Ulozit APK
        uses: actions/upload-artifact@v4
        with:
          name: Norma-Android-APK
          path: Norma-beta.apk
          if-no-files-found: error
          retention-days: 30
