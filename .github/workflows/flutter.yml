name: Bootstrap PRIDEL Flutter project

on:
  workflow_dispatch:
  push:
    paths:
      - 'Pridel_Flutter_Source.zip'
      - '.github/workflows/flutter.yml'

permissions:
  contents: write

concurrency:
  group: pridel-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Create full Android Flutter project
        run: |
          rm -rf /tmp/pridel_source /tmp/pridel_full
          mkdir -p /tmp/pridel_source
          unzip -q Pridel_Flutter_Source.zip -d /tmp/pridel_source
          flutter create --platforms=android --org sk.pridel --project-name pridel /tmp/pridel_full
          rm -rf /tmp/pridel_full/lib /tmp/pridel_full/assets /tmp/pridel_full/test /tmp/pridel_full/tool
          cp -R /tmp/pridel_source/lib /tmp/pridel_full/lib
          cp -R /tmp/pridel_source/assets /tmp/pridel_full/assets
          cp -R /tmp/pridel_source/test /tmp/pridel_full/test
          cp -R /tmp/pridel_source/tool /tmp/pridel_full/tool
          cp /tmp/pridel_source/pubspec.yaml /tmp/pridel_full/pubspec.yaml
          cp /tmp/pridel_source/analysis_options.yaml /tmp/pridel_full/analysis_options.yaml
          cp /tmp/pridel_source/README.md /tmp/pridel_full/README.md
          cd /tmp/pridel_full
          flutter pub get
          python3 tool/configure_android.py .
          dart run flutter_launcher_icons
          dart format lib test tool
          python3 tool/validate_seed.py
          python3 tool/validate_project.py
          python3 tool/validate_android.py .
          flutter analyze
          flutter test
          flutter build apk --release --build-number "${{ github.run_number }}"
          cd "$GITHUB_WORKSPACE"
          rm -rf pridel
          cp -R /tmp/pridel_full pridel

      - name: Install permanent full-project workflow
        run: |
          cat > .github/workflows/flutter.yml <<'EOF'
          name: Build PRIDEL Flutter APK

          on:
            workflow_dispatch:
            push:
              paths:
                - 'pridel/**'
                - '.github/workflows/flutter.yml'

          permissions:
            contents: read

          concurrency:
            group: pridel-build-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 40
              defaults:
                run:
                  working-directory: pridel

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Flutter 3.47.5
                  uses: subosito/flutter-action@v2
                  with:
                    flutter-version: '3.47.5'
                    cache: true

                - name: Dependencies
                  run: flutter pub get

                - name: Validate formatting
                  run: dart format --output=none --set-exit-if-changed lib test tool

                - name: Validate data and Android project
                  run: |
                    python3 tool/validate_seed.py
                    python3 tool/validate_project.py
                    python3 tool/validate_android.py .

                - name: Analyze
                  run: flutter analyze

                - name: Tests
                  run: flutter test

                - name: Build release APK
                  run: flutter build apk --release --build-number "${{ github.run_number }}"

                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: PRIDEL-Flutter-APK
                    path: pridel/build/app/outputs/flutter-apk/app-release.apk
                    if-no-files-found: error
                    retention-days: 30
          EOF

      - name: Commit complete project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pridel .github/workflows/flutter.yml
          git commit -m "Migrate PRIDEL to full Flutter project" || true
          git push

      - name: Upload APK from bootstrap build
        uses: actions/upload-artifact@v4
        with:
          name: PRIDEL-Flutter-APK
          path: pridel/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
