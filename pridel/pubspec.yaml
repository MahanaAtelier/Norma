name: pridel
description: PRÍDEL - rodinný plánovač jedla, zásob a nákupu.
publish_to: "none"
version: 0.6.3+10

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  sqflite: ^2.4.4
  file_picker: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/recipes.json
    - assets/data/ingredients.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/pridel_icon.png
  adaptive_icon_background: "#FFF9FC"
  adaptive_icon_foreground: assets/branding/pridel_icon_foreground.png
